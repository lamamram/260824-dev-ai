# Stack complète : base de données + pgAdmin + application FastAPI
# Lancement : docker compose -f compose-with-app.yml up -d

services:
  database:
    # la version 18+ de PostgreSQL demande une autre configuration pour le mot de passe, donc on reste sur la version 17
    image: 'docker.io/postgres:17'
    environment:
      POSTGRES_PASSWORD: "roottoor"
    ports:
      - 5432:5432
    volumes:
      - pg-data:/var/lib/postgresql/data/

  pgadmin:
    image: 'docker.io/dpage/pgadmin4:latest'
    environment:
      PGADMIN_DEFAULT_EMAIL: "me@example.com"
      PGADMIN_DEFAULT_PASSWORD: "roottoor"
    # pgadmin est accessible sur le port 15080 de l'hôte, mais il écoute sur le port 80 à l'intérieur du conteneur
    ports:
      - 15080:80
    volumes:
      - pgadmin-data:/var/lib/pgadmin/

  app:
    # image Python officielle (Debian bookworm) : le venv y est créé sans problème,
    # contrairement à un venv créé sur le filesystem Windows monté dans le conteneur
    image: docker.io/python:3.12-slim
    working_dir: /app
    ports:
      # l'API FastAPI est accessible sur http://localhost:8000 de l'hôte
      - "8000:8000"
    volumes:
      # le code source est monté depuis l'hôte Windows : il reste éditable avec les outils Windows
      - .:/app
      # le venv est placé dans un volume nommé Docker (filesystem Linux natif de la microVM) :
      # un venv utilise des liens symboliques (bin/python) et des shebangs qui cassent
      # sur un filesystem Windows monté ; le volume nommé évite ce problème
      - venv:/app/.venv
    environment:
      # pour que les outils (pytest, uvicorn, etc.) utilisent le venv
      VIRTUAL_ENV: /app/.venv
      PATH: /app/.venv/bin:/usr/local/bin:/usr/bin:/bin
      # la connexion à la base est résolue par le nom de service Docker "database"
      PG_HOST: database
    # au premier lancement : crée le venv, installe les dépendances puis démarre uvicorn en mode reload
    command: >
      sh -c "python -m venv /app/.venv &&
             /app/.venv/bin/pip install -r requirements.txt &&
             /app/.venv/bin/uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      - database

volumes:
  pg-data:
  pgadmin-data:
  venv:

# dans pgadmin, se connecter avec: me@example.com / roottoor
# créer un serveur "default" avec une connexion : host=database, port=5432, username=postgres, password=roottoor
# créer une base de données "formation" dans ce serveur
# puis initialiser les données : docker compose -f compose-with-app.yml exec app python init_db.py
